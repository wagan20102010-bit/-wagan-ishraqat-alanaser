<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إشراقة العناصر</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Tajawal","Arial",sans-serif;
    background:
        radial-gradient(circle at 20% 10%,rgba(220,205,255,.45),transparent 28%),
        radial-gradient(circle at 85% 80%,rgba(190,240,235,.35),transparent 30%),
        #faf9fc;
    color:#39334b;
    min-height:100vh;
}

/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,rgba(221,207,255,.75),transparent 45%),
        #faf9fc;
    transition:opacity .8s ease,visibility .8s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
}

.intro-title{
    font-size:clamp(40px,8vw,82px);
    font-weight:800;
    color:#7056a8;
    letter-spacing:1px;
    text-shadow:
        0 5px 20px rgba(112,86,168,.18);
}

/* =========================
   MAIN
========================= */

#mainPage{
    width:100%;
    padding:38px 18px 50px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    color:#7056a8;
    font-size:clamp(28px,5vw,46px);
    margin-bottom:8px;
}

.header p{
    color:#777084;
    font-size:16px;
}

/* =========================
   SEARCH
========================= */

.search-box{
    width:min(650px,100%);
    margin:0 auto 30px;
    position:relative;
}

.search-box input{
    width:100%;
    padding:16px 22px;
    border-radius:18px;
    border:2px solid #ddd4ef;
    outline:none;
    background:white;
    color:#4c435d;
    font-size:16px;
    box-shadow:0 8px 25px rgba(99,74,130,.08);
    transition:.25s;
}

.search-box input:focus{
    border-color:#9a7bd0;
    box-shadow:0 8px 28px rgba(112,86,168,.16);
}

/* =========================
   PERIODIC TABLE
========================= */

.table-wrapper{
    width:100%;
    overflow-x:auto;
    padding:8px 2px 20px;
}

.periodic-table{
    width:max-content;
    min-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(18,58px);
    grid-auto-rows:72px;
    gap:7px;
    direction:ltr;
}

.element{
    position:relative;
    border-radius:14px;
    border:1px solid rgba(80,65,100,.08);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:
        transform .22s ease,
        box-shadow .22s ease,
        filter .22s ease;
    direction:rtl;
    user-select:none;
}

.element:hover{
    transform:translateY(-4px);
    filter:brightness(1.04);
    box-shadow:0 10px 25px rgba(70,50,90,.15);
    z-index:10;
}

.element .number{
    position:absolute;
    top:6px;
    left:7px;
    font-size:9px;
    opacity:.7;
}

.element .symbol{
    font-size:21px;
    font-weight:800;
}

.element .name{
    font-size:8px;
    margin-top:3px;
    text-align:center;
}

.alkali{
    background:#ffd9df;
}

.alkaline{
    background:#ffe8b7;
}

.transition{
    background:#d9e8ff;
}

.post-transition{
    background:#dcefdc;
}

.metalloid{
    background:#e9ddff;
}

.nonmetal{
    background:#d9f4ef;
}

.halogen{
    background:#d9e7ff;
}

.noble{
    background:#f1dcff;
}

.lanthanide{
    background:#ffe1ef;
}

.actinide{
    background:#ffd9cb;
}

.unknown{
    background:#e8e8ed;
}

/* =========================
   SEARCH HIGHLIGHT
========================= */

.element.search-match{
    transform:translateY(-4px);
    z-index:20;

    border:2px solid #35d9d0;

    box-shadow:
        0 0 0 3px rgba(53,217,208,.22),
        0 0 18px rgba(53,217,208,.75),
        0 0 35px rgba(53,217,208,.45);

    animation:searchGlow 1.4s ease-in-out infinite alternate;
}

@keyframes searchGlow{
    from{
        box-shadow:
            0 0 0 3px rgba(53,217,208,.18),
            0 0 15px rgba(53,217,208,.55);
    }

    to{
        box-shadow:
            0 0 0 4px rgba(53,217,208,.28),
            0 0 25px rgba(53,217,208,.9),
            0 0 40px rgba(53,217,208,.4);
    }
}

/* =========================
   ATOM PAGE
========================= */

#atomPage{
    display:none;
    min-height:100vh;
    padding:28px 18px 55px;
}

#atomPage.active{
    display:block;
}

.back-button{
    border:none;
    background:white;
    color:#7056a8;
    border:2px solid #e2d8f2;
    border-radius:16px;
    padding:11px 18px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 7px 20px rgba(90,70,120,.08);
    transition:.2s;
}

.back-button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(90,70,120,.13);
}

.atom-header{
    text-align:center;
    margin:25px auto 15px;
}

.atom-header .symbol{
    font-size:64px;
    font-weight:900;
    color:#7056a8;
}

.atom-header h2{
    font-size:28px;
    margin-top:3px;
    color:#4c435d;
}

.atom-header p{
    color:#8a8297;
    margin-top:5px;
}

/* =========================
   ATOM VISUAL
========================= */

.atom-section{
    width:min(1100px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);
    gap:30px;
    align-items:center;
}

.atom-visual{
    min-height:520px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.atom{
    width:460px;
    height:460px;
    position:relative;
    max-width:95vw;
    max-height:95vw;
}

.orbit{
    position:absolute;
    border:2px solid rgba(112,86,168,.25);
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.orbit.o1{
    width:110px;
    height:110px;
}

.orbit.o2{
    width:165px;
    height:165px;
}

.orbit.o3{
    width:220px;
    height:220px;
}

.orbit.o4{
    width:275px;
    height:275px;
}

.orbit.o5{
    width:330px;
    height:330px;
}

.orbit.o6{
    width:385px;
    height:385px;
}

.orbit.o7{
    width:440px;
    height:440px;
}

/* =========================
   NUCLEUS
========================= */

.nucleus{
    position:absolute;
    width:92px;
    height:92px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(circle at 35% 30%,#fff3a7,#f8c928 55%,#e6aa00);
    border:5px solid #f1bd18;
    box-shadow:
        0 0 25px rgba(241,189,24,.35),
        inset 0 0 15px rgba(255,255,255,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    z-index:10;
}

.nucleus-particles{
    width:100%;
    height:100%;
    position:relative;
}

.nucleus-particle{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8px;
    font-weight:900;
    color:white;
    box-shadow:0 2px 5px rgba(0,0,0,.16);
}

.proton{
    background:#f1c329;
    border:1px solid #dba900;
}

.neutron{
    background:#e75c63;
    border:1px solid #cc3d46;
    flex-direction:column;
    line-height:7px;
}

.neutron span{
    display:block;
}

/* fixed visual particles */

.p1{left:21px;top:25px}
.p2{left:50px;top:24px}
.p3{left:30px;top:51px}
.p4{left:55px;top:52px}

.n1{left:36px;top:14px}
.n2{left:36px;top:58px}
.n3{left:16px;top:39px}
.n4{left:60px;top:39px}

/* =========================
   ELECTRONS
========================= */

.electron{
    position:absolute;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#55aef7;
    border:2px solid #318bd3;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:8px;
    font-weight:900;
    transform:translate(-50%,-50%);
    box-shadow:
        0 3px 8px rgba(49,139,211,.3);
    z-index:20;
}

/* =========================
   HEAVY ATOMS Xe+
========================= */

.atom.heavy-atom{
    width:500px;
    height:500px;
}

.atom.heavy-atom .orbit.o1{
    width:90px;
    height:90px;
}

.atom.heavy-atom .orbit.o2{
    width:145px;
    height:145px;
}

.atom.heavy-atom .orbit.o3{
    width:200px;
    height:200px;
}

.atom.heavy-atom .orbit.o4{
    width:255px;
    height:255px;
}

.atom.heavy-atom .orbit.o5{
    width:315px;
    height:315px;
}

.atom.heavy-atom .orbit.o6{
    width:375px;
    height:375px;
}

.atom.heavy-atom .orbit.o7{
    width:435px;
    height:435px;
}

.atom.heavy-atom .nucleus{
    width:68px;
    height:68px;
    border-width:4px;
}

.atom.heavy-atom .nucleus-particle{
    width:12px;
    height:12px;
    font-size:6px;
}

.atom.heavy-atom .p1{left:16px;top:18px}
.atom.heavy-atom .p2{left:39px;top:17px}
.atom.heavy-atom .p3{left:21px;top:39px}
.atom.heavy-atom .p4{left:42px;top:40px}

.atom.heavy-atom .n1{left:27px;top:10px}
.atom.heavy-atom .n2{left:27px;top:43px}
.atom.heavy-atom .n3{left:10px;top:27px}
.atom.heavy-atom .n4{left:43px;top:27px}

.atom.heavy-atom .electron{
    width:14px;
    height:14px;
    font-size:5px;
    border-width:1.5px;
}

/* =========================
   INFO
========================= */

.info-area{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.info-card{
    background:white;
    border-radius:20px;
    padding:17px 19px;
    border:1px solid rgba(100,80,130,.08);
    box-shadow:0 8px 25px rgba(90,70,120,.07);
}

.info-card h3{
    font-size:15px;
    color:#7056a8;
    margin-bottom:5px;
}

.info-card .value{
    font-size:19px;
    font-weight:800;
    color:#4d455b;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.colorful:nth-child(1){
    border-top:5px solid #a985e6;
}

.colorful:nth-child(2){
    border-top:5px solid #55bfe5;
}

.colorful:nth-child(3){
    border-top:5px solid #f3c34a;
}

.colorful:nth-child(4){
    border-top:5px solid #e97691;
}

.colorful:nth-child(5){
    border-top:5px solid #64c58a;
}

.colorful:nth-child(6){
    border-top:5px solid #8c9ee8;
}

/* =========================
   FAMILY
========================= */

.family-card{
    background:
        linear-gradient(135deg,#fff,#f5efff);
}

.family-description{
    line-height:1.9;
    color:#6f6779;
    font-size:14px;
    margin-top:7px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

    .atom-section{
        grid-template-columns:1fr;
    }

    .atom-visual{
        min-height:480px;
    }

    .atom{
        transform:scale(.88);
    }

    .atom.heavy-atom{
        transform:scale(.82);
    }
}

@media(max-width:520px){

    #mainPage{
        padding:25px 10px 40px;
    }

    .periodic-table{
        grid-template-columns:repeat(18,51px);
        grid-auto-rows:64px;
        gap:5px;
        min-width:1000px;
    }

    .element .symbol{
        font-size:18px;
    }

    .atom-visual{
        min-height:390px;
        overflow:hidden;
    }

    .atom{
        transform:scale(.68);
    }

    .atom.heavy-atom{
        transform:scale(.64);
    }

    .info-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- =========================
     INTRO
========================= -->

<div id="intro">
    <div class="intro-title">إشراقة العناصر</div>
</div>


<!-- =========================
     PERIODIC TABLE PAGE
========================= -->

<section id="mainPage">

    <div class="header">
        <h1>الجدول الدوري للعناصر</h1>
        <p>استكشف العناصر واكتشف خصائصها واستخداماتها</p>
    </div>

    <div class="search-box">
        <input
            id="searchInput"
            type="text"
            placeholder="ابحث عن رمز أو اسم العنصر بالإنجليزي..."
            autocomplete="off"
        >
    </div>

    <div class="table-wrapper">
        <div class="periodic-table" id="periodicTable"></div>
    </div>

</section>


<!-- =========================
     ATOM PAGE
========================= -->

<section id="atomPage">

    <button class="back-button" id="backButton">
        ← العودة إلى الجدول الدوري
    </button>

    <div class="atom-header">
        <div class="symbol" id="atomSymbol"></div>
        <h2 id="atomName"></h2>
        <p id="atomArabicName"></p>
    </div>

    <div class="atom-section">

            <div class="atom" id="atomVisual">

                <div class="orbit o1"></div>
                <div class="orbit o2"></div>
                <div class="orbit o3"></div>
                <div class="orbit o4"></div>
                <div class="orbit o5"></div>
                <div class="orbit o6"></div>
                <div class="orbit o7"></div>

                <div class="nucleus">

                        <!-- Proton -->
                        <div class="nucleus-particle proton p1">
                            p⁺

                            p⁺
                        </div>

                        <div class="nucleus-particle proton p3">
                            p⁺
                        </div>

                        <div class="nucleus-particle proton p4">

                        </div>

                        <div class="nucleus-particle neutron n1">

                            <span>+</span>
                            <span>−</span>

                        <div class="nucleus-particle neutron n3">

                            <span>−</span>
                        </div>

                        <div class="nucleus-particle neutron n4">
                            <span>+</span>
                            <span>−</span>
                        </div>

                    </div>
                </div>

                <div id="electrons"></div>

            </div>

        </div>


        <!-- INFORMATION -->

        <div class="info-area">

            <div class="info-grid">

                <div class="info-card colorful">
                    <h3>العدد الذري</h3>
                    <div class="value" id="atomicNumber"></div>
                </div>

                <div class="info-card colorful">
                    <h3>الكتلة الذرية</h3>
                    <div class="value" id="atomicMass"></div>
                </div>

                <div class="info-card colorful">
                    <h3>البروتونات</h3>
                    <div class="value" id="protons"></div>
                </div>

                <div class="info-card colorful">
                    <h3>النيترونات</h3>
                    <div class="value" id="neutrons"></div>
                </div>

                <div class="info-card colorful">
                    <h3>الإلكترونات</h3>
                    <div class="value" id="electronCount"></div>
                </div>

                <div class="info-card colorful">
                    <h3>حالة العنصر</h3>
                    <div class="value" id="state"></div>
                </div>

            </div>


            <div class="info-grid">

                <div class="info-card">
                    <h3>المجموعة</h3>
                    <div class="value" id="group"></div>
                </div>

                <div class="info-card">
                    <h3>الدورة</h3>
                    <div class="value" id="period"></div>
                </div>

                <div class="info-card">
                    <h3>الفئة</h3>
                    <div class="value" id="block"></div>
                </div>

                <div class="info-card">
                    <h3>عائلة العنصر</h3>
                    <div class="value" id="family"></div>
                </div>

            </div>


            <div class="info-card family-card">
                <h3>خصائص العائلة</h3>
                <div class="family-description" id="familyDescription"></div>
            </div>

        </div>

    </div>

</section>

/* =========================================================
   PERIODIC TABLE POSITION
========================================================= */

function positionForElement(element){

    if(element.z >= 58 && element.z <= 71){
        return {
            row:8,
            col:element.z - 54
        };
    }

    if(element.z >= 90 && element.z <= 103){
        return {
            row:9,
            col:element.z - 86
        };
    }

    const row = element.period;

    let col = element.group;

    if(element.z === 57) col = 3;
    if(element.z === 89) col = 3;

    return {
        row,
        col
    };
}


/* =========================================================
   CATEGORY CLASS
========================================================= */

function categoryClass(element){

    if(element.family === "الفلزات القلوية")
        return "alkali";

    if(element.family === "الفلزات القلوية الترابية")
        return "alkaline";

    if(element.family === "الفلزات الانتقالية")
        return "transition";

    if(element.family === "اللانثانيدات")
        return "lanthanide";

    if(element.family === "الأكتينيدات")
        return "actinide";

    if(element.family === "الهالوجينات")
        return "halogen";

    if(element.family === "الغازات النبيلة")
        return "noble";

    if(element.family === "الهيدروجين")
        return "nonmetal";

    if(
        element.family === "عائلة البورون" ||
        element.family === "عائلة الكربون" ||
        element.family === "عائلة النيتروجين" ||
        element.family === "عائلة الأكسجين"
    ){
        return "post-transition";
    }

    return "unknown";
}


/* =========================================================
   CREATE PERIODIC TABLE
========================================================= */

const table = document.getElementById("periodicTable");

elements.forEach(element => {

    const position = positionForElement(element);

    const card = document.createElement("div");

    card.className =
        `element ${categoryClass(element)}`;

    card.dataset.symbol = element.s.toLowerCase();
    card.dataset.name = element.name.toLowerCase();
    card.dataset.z = element.z;

    card.style.gridRow = position.row;
    card.style.gridColumn = position.col;

    card.innerHTML = `
        <span class="number">${element.z}</span>
        <span class="symbol">${element.s}</span>
        <span class="name">${element.ar}</span>
    `;

    card.addEventListener("click", () => {
        openAtom(element);
    });

    table.appendChild(card);
});


/* =========================================================
   SEARCH
========================================================= */

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("input", () => {

    const query =
        searchInput.value.trim().toLowerCase();

    document
        .querySelectorAll(".element")
        .forEach(el => {
            el.classList.remove("search-match");
        });

    if(!query) return;

    const found = elements.find(element =>
        element.s.toLowerCase() === query ||
        element.name.toLowerCase() === query
    );

    if(found){

        const card =
            document.querySelector(
                `.element[data-z="${found.z}"]`
            );

        if(card){

            card.classList.add("search-match");

            card.scrollIntoView({
                behavior:"smooth",
                block:"center",
                inline:"center"
            });
        }
    }

});


/* =========================================================
   PAGE SWITCHING
========================================================= */

const mainPage =
    document.getElementById("mainPage");

const atomPage =
    document.getElementById("atomPage");

const backButton =
    document.getElementById("backButton");


function openAtom(element){

    mainPage.style.display = "none";
    atomPage.classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"instant"
    });

    renderAtom(element);
}


backButton.addEventListener("click", () => {

    atomPage.classList.remove("active");
    mainPage.style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"instant"
    });
});


/* =========================================================
   ATOM RENDER
========================================================= */

function renderAtom(element){

    document.getElementById("atomSymbol").textContent =
        element.s;

    document.getElementById("atomName").textContent =
        element.name;

    document.getElementById("atomArabicName").textContent =
        element.ar;

    document.getElementById("atomicNumber").textContent =
        element.z;

    document.getElementById("atomicMass").textContent =
        element.mass;

    document.getElementById("protons").textContent =
        element.z;

    document.getElementById("neutrons").textContent =
        element.neutron;

    document.getElementById("electronCount").textContent =
        element.z;

    document.getElementById("state").textContent =
        element.state;

    document.getElementById("group").textContent =
        element.group === "—"
            ? "سلسلة داخلية"
            : element.group;

    document.getElementById("period").textContent =
        element.period;

    document.getElementById("block").textContent =
        element.block;

    document.getElementById("family").textContent =
        element.family;

    document.getElementById("familyDescription").textContent =
        familyDescriptions[element.family] || "";


    const atomVisual =
        document.getElementById("atomVisual");

    /*
       من الزينون 54 وما بعده:
       - نواة أصغر
       - جسيمات أصغر
       - إلكترونات أصغر
       - حتى 7 مستويات
    */

    if(element.z >= 54){
        atomVisual.classList.add("heavy-atom");
    }else{
        atomVisual.classList.remove("heavy-atom");
    }


    /*
       إظهار عدد المستويات الحقيقي فقط
    */

    const orbits =
        document.querySelectorAll(".orbit");

    orbits.forEach((orbit,index) => {

        if(index < element.shells.length){
            orbit.style.display = "block";
        }else{
            orbit.style.display = "none";
        }

    });


    /*
       الإلكترونات
    */

    const electronsContainer =
        document.getElementById("electrons");

    electronsContainer.innerHTML = "";


    element.shells.forEach((count,shellIndex) => {

        const orbitNumber = shellIndex + 1;

        const orbit =
            document.querySelector(
                `.orbit.o${orbitNumber}`
            );

        if(!orbit) return;

        const rect =
            orbit.getBoundingClientRect();

        /*
           نعتمد نصف قطر CSS بدل حجم الشاشة
        */

        const computed =
            getComputedStyle(orbit);

        const width =
            parseFloat(computed.width);

        const height =
            parseFloat(computed.height);

        const radiusX =
            width / 2;

        const radiusY =
            height / 2;


        for(let i=0;i<count;i++){

            const electron =
                document.createElement("div");

            electron.className = "electron";

            electron.textContent = "e⁻";

            /*
               توزيع متساوٍ حول المستوى
            */

            const angle =
                (360 / count) * i - 90;

            const rad =
                angle * Math.PI / 180;

            const x =
                Math.cos(rad) * radiusX;

            const y =
                Math.sin(rad) * radiusY;


            electron.style.left =
                `calc(50% + ${x}px)`;

            electron.style.top =
                `calc(50% + ${y}px)`;


            atomVisual.appendChild(electron);

        }

    });

}
