<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إشراقة العناصر</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf9f7;
    color: #332d45;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* =========================
   المقدمة
========================= */

.intro {
    position: fixed;
    inset: 0;
    background: #faf9f7;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 1000;
    animation: introFade 1.5s ease 3s forwards;
}

.glow {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: rgba(190, 170, 220, 0.18);
    filter: blur(70px);
    animation: glow 3s ease-in-out infinite alternate;
}

.intro-title {
    position: relative;
    color: #332d45;
    font-size: 52px;
    font-weight: 600;
    letter-spacing: 2px;
    opacity: 0;
    animation: titleIn 1.8s ease forwards;
}

@keyframes titleIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes glow {
    from {
        transform: scale(0.9);
        opacity: 0.5;
    }

    to {
        transform: scale(1.1);
        opacity: 1;
    }
}

@keyframes introFade {
    to {
        opacity: 0;
        visibility: hidden;
    }
}

/* =========================
   الصفحة الرئيسية
========================= */

.main {
    min-height: 100vh;
    padding: 55px 25px 70px;
}

.heading {
    text-align: center;
    margin-bottom: 30px;
}

.heading h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 600;
    color: #332d45;
}

.heading p {
    margin: 10px 0 0;
    color: #77717f;
    font-size: 15px;
}

/* =========================
   البحث
========================= */

.search-box {
    max-width: 520px;
    margin: 0 auto 28px;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 15px 20px;
    border: 1px solid #ddd7e2;
    border-radius: 14px;
    background: white;
    color: #332d45;
    font-size: 16px;
    outline: none;
    text-align: right;
    box-shadow: 0 5px 20px rgba(70, 55, 85, 0.05);
    transition: 0.2s ease;
}

.search-box input:focus {
    border-color: #b9a6c9;
    box-shadow: 0 7px 25px rgba(100, 75, 120, 0.10);
}

/* =========================
   مفتاح الألوان
========================= */

.legend {
    max-width: 1150px;
    margin: 0 auto 30px;
    padding: 18px 20px;
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid #e4dfe7;
    border-radius: 18px;
}

.legend-title {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #4d4558;
    margin-bottom: 15px;
}

.legend-items {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 18px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #625b68;
    font-size: 12px;
    white-space: nowrap;
}

.legend-color {
    width: 17px;
    height: 17px;
    border-radius: 5px;
    border: 1px solid rgba(60, 50, 70, 0.10);
    flex-shrink: 0;
}

/* =========================
   الجدول الدوري
========================= */

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    padding: 45px 25px 60px;
}

.periodic-table {
    min-width: 1100px;
    max-width: 1450px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(18, 1fr);
    grid-template-rows: repeat(7, 90px);
    gap: 7px;

    direction: ltr;
}

.element {
    border-radius: 10px;
    padding: 7px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    border: 1px solid rgba(60, 50, 70, 0.08);

    transition:
        transform 0.35s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.35s ease;

    min-width: 0;
    direction: ltr;
    position: relative;
}

.element:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 18px rgba(60, 50, 70, 0.13);
}

.symbol {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    color: #332d45;
}

.name {
    display: block;
    margin-top: 7px;
    font-size: 10px;
    line-height: 1.1;
    color: #4f4858;
    font-weight: 500;
    white-space: nowrap;
}

/* =========================
   البحث
========================= */

.element.search-match {
    transform: translateY(-4px);
    z-index: 20;

    border: 2px solid #35d9d0;

    box-shadow:
        0 0 0 3px rgba(53, 217, 208, 0.22),
        0 0 18px rgba(53, 217, 208, 0.75),
        0 0 35px rgba(53, 217, 208, 0.45);

    animation: searchGlow 1.4s ease-in-out infinite alternate;
}

@keyframes searchGlow {
    from {
        box-shadow:
            0 0 0 3px rgba(53, 217, 208, 0.18),
            0 0 15px rgba(53, 217, 208, 0.55);
    }

    to {
        box-shadow:
            0 0 0 4px rgba(53, 217, 208, 0.28),
            0 0 25px rgba(53, 217, 208, 0.9),
            0 0 40px rgba(53, 217, 208, 0.4);
    }
}

/* =========================
   ألوان العناصر
========================= */

.alkali {
    background: #f6c7c7;
}

.alkaline {
    background: #f7dfae;
}

.transition {
    background: #f3ed9d;
}

.post-transition {
    background: #c8e7c1;
}

.metalloid {
    background: #bfe5dd;
}

.nonmetal {
    background: #b9d9f2;
}

.halogen {
    background: #c9c1ec;
}

.noble {
    background: #e0bfe8;
}

.lanthanide {
    background: #f2c9df;
}

.actinide {
    background: #e8c8b8;
}

/* =========================
   السلاسل
========================= */

.series {
    max-width: 1000px;
    margin: 30px auto 0;

    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 7px;

    direction: ltr;
}

.series-title {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 14px;
    color: #6f6878;
    margin: 5px 0;
    direction: rtl;
}

/* =========================
   بطاقة معلومات العنصر
========================= */

.element-info {
    max-width: 1100px;
    margin: 10px auto 70px;
    background: rgba(255,255,255,0.92);
    border: 1px solid #e4dfe7;
    border-radius: 25px;
    padding: 28px;
    box-shadow: 0 15px 45px rgba(70,55,85,0.08);
    display: none;
}

.element-info.show {
    display: block;
    animation: infoAppear 0.5s ease;
}

@keyframes infoAppear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.info-header {
    text-align: center;
    margin-bottom: 25px;
}

.info-symbol {
    width: 82px;
    height: 82px;
    margin: 0 auto 12px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 700;
    background: #f2edf7;
    color: #332d45;
}

.info-header h2 {
    margin: 0;
    font-size: 28px;
}

.info-header p {
    margin: 8px 0 0;
    color: #77717f;
}

/* =========================
   أزرار الأقسام
========================= */

.info-tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}

.info-tab {
    border: 1px solid #e2dce7;
    background: #fbfafc;
    border-radius: 17px;
    padding: 16px 10px;
    cursor: pointer;
    color: #4d4558;
    transition: 0.25s ease;
    font-size: 14px;
}

.info-tab:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(70,55,85,0.08);
}

.info-tab.active {
    background: #ece4f3;
    border-color: #c8b6d8;
}

.info-tab .tab-icon {
    display: block;
    font-size: 24px;
    margin-bottom: 7px;
}

.info-content {
    min-height: 350px;
}

/* =========================
   قسم الذرة
========================= */

.atom-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    align-items: center;
}

.atom-visual {
    min-height: 340px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.atom {
    width: 290px;
    height: 290px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nucleus {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: #eee5f4;
    border: 3px solid #c9b5d8;
    box-shadow:
        0 0 25px rgba(190,170,220,0.35),
        inset 0 0 20px rgba(255,255,255,0.7);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.nucleus-symbol {
    font-size: 27px;
    font-weight: bold;
}

.nucleus-text {
    font-size: 9px;
    color: #706778;
    margin-top: 3px;
}

.orbit {
    position: absolute;
    border: 1px solid rgba(120,100,140,0.28);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.orbit-1 {
    width: 145px;
    height: 145px;
}

.orbit-2 {
    width: 215px;
    height: 215px;
}

.orbit-3 {
    width: 275px;
    height: 275px;
}

.electron {
    position: absolute;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #35d9d0;
    box-shadow: 0 0 12px rgba(53,217,208,0.75);
}

.atom-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 11px;
}

.detail-card {
    padding: 14px;
    border-radius: 15px;
    background: #faf8fb;
    border: 1px solid #ebe6ee;
}

.detail-card span {
    display: block;
    color: #88808f;
    font-size: 11px;
    margin-bottom: 5px;
}

.detail-card strong {
    font-size: 15px;
    color: #40384b;
}

.family-box {
    margin-top: 15px;
    padding: 18px;
    background: #f7f2fa;
    border-radius: 17px;
    border: 1px solid #e7ddec;
}

.family-box h3 {
    margin: 0 0 9px;
    font-size: 16px;
}

.family-box p {
    margin: 0;
    color: #625b68;
    line-height: 1.8;
    font-size: 13px;
}

/* =========================
   التوزيع الإلكتروني
========================= */

.electron-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    align-items: center;
}

.configuration-box {
    background: #faf8fb;
    border: 1px solid #ebe5ef;
    border-radius: 18px;
    padding: 22px;
}

.configuration-box h3 {
    margin-top: 0;
    font-size: 17px;
}

.configuration {
    direction: ltr;
    text-align: left;
    font-size: 18px;
    line-height: 2;
    color: #4b4255;
    word-break: break-word;
}

.shell-box {
    display: flex;
    justify-content: center;
    align-items: center;
}

.shells {
    width: 310px;
    height: 310px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.shell {
    position: absolute;
    border: 1px solid #cfc4d6;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.shell:nth-child(1) {
    width: 75px;
    height: 75px;
}

.shell:nth-child(2) {
    width: 145px;
    height: 145px;
}

.shell:nth-child(3) {
    width: 215px;
    height: 215px;
}

.shell:nth-child(4) {
    width: 285px;
    height: 285px;
}

.shell-nucleus {
    width: 50px;
    height: 50px;
    background: #eee5f4;
    border: 2px solid #c9b5d8;
    border-radius: 50%;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.animated-electron {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #35d9d0;
    box-shadow: 0 0 12px rgba(53,217,208,0.8);
    opacity: 0;
    transform: scale(0.2);
    animation: electronAppear 0.45s ease forwards;
}

@keyframes electronAppear {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.shell-labels {
    margin-top: 18px;
    text-align: center;
    color: #77717f;
    font-size: 13px;
}

/* =========================
   للجوال
========================= */

@media (max-width: 700px) {

    .main {
        padding: 40px 15px 60px;
    }

    .heading h1 {
        font-size: 27px;
    }

    .heading p {
        font-size: 13px;
    }

    .intro-title {
        font-size: 38px;
    }

    .periodic-table {
        min-width: 1050px;
    }

    .legend {
        padding: 16px 12px;
    }

    .legend-items {
        gap: 9px 13px;
    }

    .legend-item {
        font-size: 11px;
    }

    .table-wrapper {
        padding-left: 15px;
        padding-right: 15px;
    }

    .element-info {
        padding: 20px 15px;
    }

    .info-tabs {
        grid-template-columns: repeat(2, 1fr);
    }

    .atom-layout,
    .electron-layout {
        grid-template-columns: 1fr;
    }

    .atom {
        width: 270px;
        height: 270px;
    }

    .atom-details {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

    <div class="glow"></div>
    <div class="intro-title">إشراقة العناصر</div>
</section>

<main class="main">

    <p>استكشف العناصر واكتشف خصائصها واستخداماتها</p>

</section>

<div class="table-wrapper">

</div>

<div class="series" id="lanthanides"></div>

<!-- =========================

========================= -->

<section class="element-info" id="elementInfo">

    <div class="info-tabs">

        <button class="info-tab active" data-tab="atom">

        <button class="info-tab" data-tab="electron">
            <span class="tab-icon">⚡</span>
            التوزيع الإلكتروني
        </button>

    </div>

    <div class="info-content" id="infoContent"></div>

</section>

</main>

const periodicTable = document.getElementById("periodicTable");

elementsData.forEach((item,index) => {

    const [symbol,name,type] = item;
    const atomicNumber = index + 1;

    const element = document.createElement("div");

    element.className = `element ${type}`;
    element.dataset.symbol = symbol;
    element.dataset.name = name;
    element.dataset.atomicNumber = atomicNumber;

    if (positions[symbol]) {
        element.style.gridColumn = positions[symbol][0];
        element.style.gridRow = positions[symbol][1];
        periodicTable.appendChild(element);
    }
    else if (["Ce","Pr","Nd","Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Lu"].includes(symbol)) {
        lanthanides.appendChild(element);
    }
    else if (["Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm","Md","No","Lr"].includes(symbol)) {
        actinides.appendChild(element);
    }

    element.innerHTML = `
        <div class="symbol">${symbol}</div>
        <div class="name">${name}</div>
    `;

    element.addEventListener("click", () => {
        showElement(element);
    });
});

/* =========================
   المجموعة والدورة والبلوك
========================= */

function getGroup(symbol) {

    if (!positions[symbol]) return "—";

    return positions[symbol][0];
}

function getPeriod(symbol) {

    if (!positions[symbol]) {

        const z = elementsData.findIndex(x => x[0] === symbol) + 1;

        if (z >= 58 && z <= 71) return 6;
        if (z >= 90 && z <= 103) return 7;

        return "—";
    }

    return positions[symbol][1];
}

function getBlock(type, group) {

    if (type === "lanthanide" || type === "actinide") return "f";

    if (group <= 2) return "s";
    if (group >= 13) return "p";
    return "d";
}

/* =========================
   أعداد الإلكترونات في الأغلفة
========================= */

const orbitalOrder = [
    [1,0,2],
    [2,0,2],
    [2,1,6],
    [3,0,2],
    [3,1,6],
    [4,0,2],
    [3,2,10],
    [4,1,6],
    [5,0,2],
    [4,2,10],
    [5,1,6],
    [6,0,2],
    [4,3,14],
    [5,2,10],
    [6,1,6],
    [7,0,2],
    [5,3,14],
    [6,2,10],
    [7,1,6],
    [6,3,14],
    [7,2,10],
    [7,3,14]
];

function getShells(atomicNumber) {

    const shells = [0,0,0,0,0,0,0];
    let remaining = atomicNumber;

    for (const orbital of orbitalOrder) {

        if (remaining <= 0) break;

        const shell = orbital[0];
        const capacity = orbital[2];
        const amount = Math.min(remaining, capacity);

        shells[shell - 1] += amount;
        remaining -= amount;
    }

    return shells.filter(x => x > 0);
}

/* =========================
   التوزيع الإلكتروني المكتوب
========================= */

function getConfiguration(atomicNumber) {

    const labels = [
        "1s","2s","2p","3s","3p","4s","3d","4p",
        "5s","4d","5p","6s","4f","5d","6p","7s",
        "5f","6d","7p","6f","7d","7f"
    ];

    let remaining = atomicNumber;
    let result = [];

    for (let i = 0; i < orbitalOrder.length; i++) {

        if (remaining <= 0) break;

        const capacity = orbitalOrder[i][2];
        const amount = Math.min(remaining, capacity);

        result.push(`${labels[i]}<sup>${amount}</sup>`);
        remaining -= amount;
    }

    return result.join(" ");
}

    selectedElement = element;
    element.style.outline = "3px solid rgba(53,217,208,0.55)";

    const symbol = element.dataset.symbol;
    const name = element.dataset.name;
    const atomicNumber = Number(element.dataset.atomicNumber);
    const type = elementsData[atomicNumber - 1][2];

    infoSymbol.textContent = symbol;
    infoName.textContent = name;
    infoSubtitle.textContent = getArabicName(symbol);

    infoBox.classList.add("show");

    document.querySelectorAll(".info-tab").forEach(tab => {
        tab.classList.remove("active");
    });

    document.querySelector('[data-tab="atom"]').classList.add("active");

    renderAtom(symbol,name,atomicNumber,type);

    setTimeout(() => {
        infoBox.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    },100);
}

/* =========================

function renderAtom(symbol,name,atomicNumber,type) {

        symbol === "H" ? 0 :
        symbol === "He" ? 2 :

/* =========================
   إلكترونات الذرة الثابتة
========================= */

function createAtomElectrons(shells) {

    let html = "";

    shells.forEach((count,shellIndex) => {

        const radius =
            shellIndex === 0 ? 72 :
            shellIndex === 1 ? 107 :
            137;

        for (let i = 0; i < count; i++) {

            const angle = (360 / count) * i - 90;

            const x =
                50 + (Math.cos(angle * Math.PI / 180) * radius / 2.9);

            const y =
                50 + (Math.sin(angle * Math.PI / 180) * radius / 2.9);

            html += `
                <span
                    class="electron"
                    style="
                        left:${x}%;
                        top:${y}%;
                        transform:translate(-50%,-50%);
                    "
                ></span>
            `;
        }
    });

    return html;
}

/* =========================
   قسم التوزيع الإلكتروني
========================= */

function renderElectronDistribution(symbol,name,atomicNumber) {

    const shells = getShells(atomicNumber);
    const configuration = getConfiguration(atomicNumber);

    infoContent.innerHTML = `

    <div class="electron-layout">

        <div class="configuration-box">

            <h3>التوزيع الإلكتروني</h3>

            <div class="configuration">
                ${configuration}
            </div>

            <div class="shell-labels">
                توزيع الإلكترونات على مستويات الطاقة:
                ${shells.join(" - ")}
            </div>

        </div>

        <div class="shell-box">

            <div class="shells">

                <div class="shell"></div>
                <div class="shell"></div>
                <div class="shell"></div>
                <div class="shell"></div>

                <div class="shell-nucleus">
                    ${symbol}
                </div>

            </div>

        </div>

    </div>

    `;

    animateElectrons(shells);
}

/* =========================
   حركة الإلكترونات
========================= */

function animateElectrons(shells) {

    const container = document.querySelector(".shells");

    if (!container) return;

    let electronNumber = 0;

    shells.forEach((count,shellIndex) => {

        const shellSizes = [37.5,72.5,107.5,142.5];
        const radius = shellSizes[shellIndex] || 142.5;

        for (let i = 0; i < count; i++) {

            const electron = document.createElement("span");

            electron.className = "animated-electron";

            const angle = (360 / count) * i - 90;

            const x =
                50 + Math.cos(angle * Math.PI / 180) * radius / 3.1;

            const y =
                50 + Math.sin(angle * Math.PI / 180) * radius / 3.1;

            electron.style.left = `${x}%`;
            electron.style.top = `${y}%`;
            electron.style.transform = "translate(-50%,-50%)";

            electron.style.animationDelay =
                `${electronNumber * 0.07}s`;

            container.appendChild(electron);

            electronNumber++;
        }
    });
}

========================= */

document.querySelectorAll(".info-tab").forEach(tab => {

    tab.addEventListener("click", () => {

        if (!selectedElement) return;

        document.querySelectorAll(".info-tab").forEach(t => {
            t.classList.remove("active");
        });

        tab.classList.add("active");

        const symbol = selectedElement.dataset.symbol;
        const name = selectedElement.dataset.name;
        const atomicNumber = Number(selectedElement.dataset.atomicNumber);
        const type = elementsData[atomicNumber - 1][2];

        if (tab.dataset.tab === "atom") {
            renderAtom(symbol,name,atomicNumber,type);
        }

        if (tab.dataset.tab === "electron") {
            renderElectronDistribution(symbol,name,atomicNumber);
        }

    });

});

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("input", function () {

    const searchValue = this.value.trim().toLowerCase();

    document.querySelectorAll(".element").forEach(element => {
        element.classList.remove("search-match");
    });

    if (!searchValue) return;

    let foundElement = null;

    document.querySelectorAll(".element").forEach(element => {

        const symbol = element.dataset.symbol.toLowerCase();
        const name = element.dataset.name.toLowerCase();

        if (
            symbol === searchValue ||
            name === searchValue
        ) {
            foundElement = element;
        }

    });

    if (foundElement) {

        foundElement.classList.add("search-match");

        foundElement.scrollIntoView({
            behavior: "smooth",
            block: "center",
            inline: "center"
        });

        setTimeout(() => {
            showElement(foundElement);
        },300);
    }

});
