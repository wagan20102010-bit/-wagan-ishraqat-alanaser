<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إشراقة العناصر</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background:
        radial-gradient(circle at 50% 10%, #eee5ff 0%, #f8f6fc 35%, #ffffff 75%);
    color: #333;
}

/* =========================
   شاشة البداية
========================= */

.intro {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center, #eee5ff, #faf9fc 65%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: introFade 1s ease 2.4s forwards;
}

.intro h1 {
    margin: 0;
    color: #8064b5;
    font-size: clamp(38px, 9vw, 75px);
    font-weight: 700;
    letter-spacing: 1px;
}

@keyframes introFade {
    to {
        opacity: 0;
        visibility: hidden;
    }
}

/* =========================
   الصفحات
========================= */

.page {
    min-height: 100vh;
    padding: 45px 20px 70px;
}

.hidden {
    display: none !important;
}

/* =========================
   العناوين
========================= */

.header {
    text-align: center;
    margin-bottom: 28px;
}

.header h1 {
    margin: 0 0 10px;
    color: #70559f;
    font-size: clamp(27px, 5vw, 45px);
}

.header p {
    margin: 0;
    color: #777;
    font-size: 16px;
}

/* =========================
   البحث
========================= */

.search-box {
    max-width: 550px;
    margin: 0 auto 35px;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 15px 20px;
    border-radius: 18px;
    border: 2px solid #e1d8f2;
    background: white;
    outline: none;
    font-size: 16px;
    color: #444;
    transition: 0.25s;
}

.search-box input:focus {
    border-color: #b69bdd;
    box-shadow: 0 0 15px rgba(126, 94, 178, 0.15);
}

/* =========================
   الجدول الدوري
========================= */

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    padding: 15px 5px 30px;
}

.periodic-table {
    min-width: 1050px;
    max-width: 1250px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(18, 1fr);
    gap: 7px;
}

.element {
    min-height: 82px;
    border-radius: 13px;
    padding: 7px 5px;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    border: 1px solid rgba(255,255,255,0.8);
}

.element:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.10);
    z-index: 5;
}

.element .number {
    position: absolute;
    top: 6px;
    right: 7px;
    font-size: 10px;
    opacity: 0.65;
}

.element .symbol {
    font-size: 25px;
    font-weight: bold;
}

.element .name {
    font-size: 9px;
    margin-top: 4px;
    text-align: center;
}

/* ألوان الفئات */

.alkali {
    background: #ffd7df;
}

.alkaline {
    background: #ffe8b7;
}

.transition {
    background: #dcd0ff;
}

.post-transition {
    background: #ccebf0;
}

.metalloid {
    background: #d7f0d2;
}

.nonmetal {
    background: #fff0b8;
}

.halogen {
    background: #cfe5ff;
}

.noble {
    background: #ead6ff;
}

.lanthanide {
    background: #f7d4eb;
}

.actinide {
    background: #f3d4c6;
}

/* =========================
   نتيجة البحث
========================= */

.element.search-match {
    transform: translateY(-4px);
    z-index: 20;

    border: 2px solid #35d9d0;

    box-shadow:
        0 0 0 3px rgba(53,217,208,0.22),
        0 0 18px rgba(53,217,208,0.75),
        0 0 35px rgba(53,217,208,0.45);

    animation: searchGlow 1.4s ease-in-out infinite alternate;
}

@keyframes searchGlow {
    from {
        box-shadow:
            0 0 0 3px rgba(53,217,208,0.18),
            0 0 15px rgba(53,217,208,0.55);
    }

    to {
        box-shadow:
            0 0 0 4px rgba(53,217,208,0.28),
            0 0 25px rgba(53,217,208,0.9),
            0 0 40px rgba(53,217,208,0.4);
    }
}

/* =========================
   صفحة الذرة
========================= */

.atom-page {
    max-width: 1050px;
    margin: auto;
}

.back-button {
    border: none;
    background: #eee7fa;
    color: #70559f;
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
    margin-bottom: 30px;
}

.back-button:hover {
    background: #e2d7f5;
    transform: translateY(-2px);
}

.atom-title {
    text-align: center;
    margin-bottom: 35px;
}

.atom-title h1 {
    margin: 0 0 8px;
    color: #70559f;
    font-size: clamp(30px, 6vw, 48px);
}

.atom-title p {
    color: #777;
    margin: 0;
}

/* =========================
   منطقة الذرة
========================= */

.atom-section {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(300px, 1fr);
    gap: 45px;
    align-items: center;
}

.atom-visual {
    min-height: 470px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* الذرة */

.atom {
    width: 390px;
    height: 390px;
    max-width: 90vw;
    max-height: 90vw;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* المدارات */

.orbit {
    position: absolute;
    border: 2px solid rgba(125, 96, 175, 0.28);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.orbit-1 {
    width: 115px;
    height: 115px;
}

.orbit-2 {
    width: 185px;
    height: 185px;
}

.orbit-3 {
    width: 255px;
    height: 255px;
}

.orbit-4 {
    width: 325px;
    height: 325px;
}

.orbit-5 {
    width: 380px;
    height: 380px;
}

/* =========================
   النواة
========================= */

.nucleus {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 30%, #fff7dc, #f6e8bd 55%, #ead9a5);
    border: 3px solid #d9bd68;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
    z-index: 20;

    /*
      مهم:
      أي شيء يتجاوز دائرة النواة يتم قصّه
    */
    overflow: hidden;

    padding: 5px;
}

/* الحاوية الداخلية */

.nucleus-particles {
    width: 100%;
    height: 100%;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    align-items: center;
    gap: 2px;
    overflow: hidden;
}

/* البروتون والنيترون */

.nucleus-particle {
    width: 17px;
    height: 17px;
    min-width: 17px;
    min-height: 17px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 7px;
    font-weight: bold;
    line-height: 1;

    flex-shrink: 0;
}

/* البروتون */

.proton {
    background: #ffd84d;
    color: #765b00;
    border: 1px solid #e2b900;
}

/* النيترون */

.neutron {
    background: #ef7777;
    color: white;
    border: 1px solid #d95353;

    flex-direction: column;
    gap: 0;
}

.neutron .plus {
    font-size: 7px;
    line-height: 6px;
}

.neutron .minus {
    font-size: 7px;
    line-height: 6px;
}

/* =========================
   الإلكترونات
========================= */

.electron {
    width: 28px;
    height: 28px;
    border-radius: 50%;

    background: #69b8ff;
    border: 2px solid #318bd4;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: bold;

    position: absolute;
    z-index: 30;
}

/* =========================
   معلومات العنصر
========================= */

.element-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.info-card {
    border-radius: 18px;
    padding: 18px;
    min-height: 105px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.info-card .label {
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
}

.info-card .value {
    font-size: 20px;
    font-weight: bold;
}

/* ألوان البطاقات */

.card-purple {
    background: #eee5ff;
    color: #70559f;
}

.card-blue {
    background: #dff1ff;
    color: #3578aa;
}

.card-yellow {
    background: #fff2c9;
    color: #9a791d;
}

.card-pink {
    background: #ffe3ee;
    color: #a34e72;
}

.card-green {
    background: #e1f5df;
    color: #4e8850;
}

.card-orange {
    background: #ffe8d2;
    color: #a6652e;
}

/* =========================
   شرح النواة
========================= */

.particle-legend {
    margin-top: 25px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 7px;

    padding: 8px 13px;
    border-radius: 12px;

    background: white;
    border: 1px solid #eee;
    font-size: 13px;
}

.legend-circle {
    width: 25px;
    height: 25px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 10px;
    font-weight: bold;
}

.legend-proton {
    background: #ffd84d;
    color: #765b00;
}

.legend-neutron {
    background: #ef7777;
    color: white;
}

.legend-electron {
    background: #69b8ff;
    color: white;
}

/* =========================
   العائلة
========================= */

.family-box {
    margin-top: 28px;
    background: white;
    border-radius: 22px;
    padding: 25px;
    border: 1px solid #eee8f5;
    box-shadow: 0 7px 25px rgba(80,60,100,0.06);
}

.family-box h2 {
    margin: 0 0 10px;
    color: #70559f;
    font-size: 22px;
}

.family-box p {
    margin: 8px 0;
    color: #666;
    line-height: 1.8;
}

.family-properties {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 15px;
}

.family-tag {
    background: #f2edff;
    color: #70559f;
    padding: 8px 13px;
    border-radius: 12px;
    font-size: 13px;
}

/* =========================
   الجوال
========================= */

@media (max-width: 800px) {

    .page {
        padding: 30px 13px 55px;
    }

    .atom-section {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .atom-visual {
        min-height: 400px;
    }

    .atom {
        width: 350px;
        height: 350px;
    }

    .orbit-1 {
        width: 100px;
        height: 100px;
    }

    .orbit-2 {
        width: 165px;
        height: 165px;
    }

    .orbit-3 {
        width: 225px;
        height: 225px;
    }

    .orbit-4 {
        width: 285px;
        height: 285px;
    }

    .orbit-5 {
        width: 335px;
        height: 335px;
    }

    .nucleus {
        width: 78px;
        height: 78px;
    }

    .nucleus-particle {
        width: 15px;
        height: 15px;
        min-width: 15px;
        min-height: 15px;
        font-size: 6px;
    }

    .neutron .plus,
    .neutron .minus {
        font-size: 6px;
        line-height: 5px;
    }

    .electron {
        width: 25px;
        height: 25px;
        font-size: 10px;
    }
}

@media (max-width: 500px) {

    .element-info {
        grid-template-columns: 1fr 1fr;
    }

    .info-card {
        min-height: 95px;
        padding: 14px;
    }

    .info-card .value {
        font-size: 17px;
    }

    .atom {
        width: 310px;
        height: 310px;
    }

    .orbit-1 {
        width: 85px;
        height: 85px;
    }

    .orbit-2 {
        width: 145px;
        height: 145px;
    }

    .orbit-3 {
        width: 200px;
        height: 200px;
    }

    .orbit-4 {
        width: 255px;
        height: 255px;
    }

    .orbit-5 {
        width: 300px;
        height: 300px;
    }

    .nucleus {
        width: 70px;
        height: 70px;
        padding: 4px;
    }

    .nucleus-particle {
        width: 13px;
        height: 13px;
        min-width: 13px;
        min-height: 13px;
        font-size: 5px;
    }

    .neutron .plus,
    .neutron .minus {
        font-size: 5px;
        line-height: 4px;
    }

    .electron {
        width: 22px;
        height: 22px;
        font-size: 9px;
    }
}
</style>
</head>

========================= -->

    <div class="table-wrapper">

                        إلكترون

                </div>

            </div>


            <!-- معلومات العنصر -->

            <div>

                    <p id="familyDescription">

                    </p>

                    <div
                        id="familyProperties"
                        class="family-properties"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</section>

/* ==========================================
   إنشاء الجدول
========================================== */

const table = document.getElementById("periodicTable");

function createElementCard(element) {

    const card = document.createElement("div");

    card.className = `element ${element.color}`;

    card.dataset.symbol = element.symbol.toLowerCase();
    card.dataset.name = element.name.toLowerCase();

    card.innerHTML = `
        <span class="number">${element.number}</span>
        <span class="symbol">${element.symbol}</span>
        <span class="name">${element.arabic}</span>
    `;

    card.addEventListener("click", () => {
        openAtomPage(element);
    });

    return card;
}


/*
    ترتيب مبسط للعرض داخل الجدول
    العناصر الموجودة في البيانات تظهر في مواقعها
*/

1: [1,1],
2: [1,18],

3: [2,1],
4: [2,2],
5: [2,13],
6: [2,14],
7: [2,15],
8: [2,16],
9: [2,17],
10:[2,18],

11:[3,1],
12:[3,2],
13:[3,13],
14:[3,14],
15:[3,15],
16:[3,16],
17:[3,17],
18:[3,18],

19:[4,1],
20:[4,2],
26:[4,8],
29:[4,11],

47:[5,11],

79:[6,11],
80:[6,12],

92:[7,6]
};


/* إضافة العناصر */

elements.forEach(element => {

    const card = createElementCard(element);

    if (positions[element.number]) {

        const [row, column] = positions[element.number];

        card.style.gridRow = row;
        card.style.gridColumn = column;

    }

    table.appendChild(card);
});


/* ==========================================
   البحث
========================================== */

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("input", () => {

    const query = searchInput.value.trim().toLowerCase();

    document
        .querySelectorAll(".element")
        .forEach(element => {
            element.classList.remove("search-match");
        });

    if (!query) return;

    const match = elements.find(element =>
        element.symbol.toLowerCase() === query ||
        element.name.toLowerCase() === query
    );

    if (!match) return;

    const cards = document.querySelectorAll(".element");

    cards.forEach(card => {

        if (
            card.dataset.symbol === match.symbol.toLowerCase() ||
            card.dataset.name === match.name.toLowerCase()
        ) {

            card.classList.add("search-match");

            card.scrollIntoView({
                behavior: "smooth",
                block: "center",
                inline: "center"
            });

        }

    });

});


/* ==========================================
   فتح صفحة الذرة
========================================== */

const tablePage = document.getElementById("tablePage");
const atomPage = document.getElementById("atomPage");
const backButton = document.getElementById("backButton");

function openAtomPage(element) {

    tablePage.classList.add("hidden");
    atomPage.classList.remove("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    renderAtom(element);
}


/* ==========================================
   زر العودة
========================================== */

backButton.addEventListener("click", () => {

    atomPage.classList.add("hidden");
    tablePage.classList.remove("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

});


/* ==========================================
   عرض الذرة
========================================== */

function renderAtom(element) {

    document.getElementById("atomElementName").textContent =
        element.arabic;

    document.getElementById("atomElementSymbol").textContent =
        `${element.symbol} · ${element.name}`;


    /* النواة */

    createNucleus(
        element.protons,
        element.neutrons
    );


    /* الإلكترونات */

    createElectrons(
        element.electrons,
        element.period
    );


    /* المعلومات */

    const info = document.getElementById("elementInfo");

    info.innerHTML = `

        <div class="info-card card-purple">
            <div class="label">العدد الذري</div>
            <div class="value">${element.number}</div>
        </div>

        <div class="info-card card-blue">
            <div class="label">عدد البروتونات</div>
            <div class="value">${element.protons}</div>
        </div>

        <div class="info-card card-yellow">
            <div class="label">عدد النيترونات</div>
            <div class="value">${element.neutrons}</div>
        </div>

        <div class="info-card card-pink">
            <div class="label">عدد الإلكترونات</div>
            <div class="value">${element.electrons}</div>
        </div>

        <div class="info-card card-green">
            <div class="label">المجموعة</div>
            <div class="value">${element.group}</div>
        </div>

        <div class="info-card card-orange">
            <div class="label">الدورة</div>
            <div class="value">${element.period}</div>
        </div>

        <div class="info-card card-purple">
            <div class="label">الفئة</div>
            <div class="value">${element.category}</div>
        </div>

        <div class="info-card card-blue">
            <div class="label">العائلة</div>
            <div class="value">${element.family}</div>
        </div>

    `;


    document.getElementById("familyName").textContent =
        element.family;

    document.getElementById("familyDescription").textContent =
        element.familyDescription;


    const properties =
        document.getElementById("familyProperties");

    properties.innerHTML = "";

    element.properties.forEach(property => {

        const tag = document.createElement("span");

        tag.className = "family-tag";
        tag.textContent = property;

        properties.appendChild(tag);

    });

}


/* ==========================================
   إنشاء النواة
========================================== */

function createNucleus(protons, neutrons) {

    const container =
        document.getElementById("nucleusParticles");

    container.innerHTML = "";


    /*
      لا نعرض كل الجسيمات للعناصر الثقيلة حتى لا
      تتحول النواة إلى كتلة مزدحمة.
      لكن الشكل يوضح بوضوح وجود البروتونات والنيترونات.
    */

    const visibleProtons =
        Math.min(5, Math.max(2, Math.ceil(protons / 20)));

    const visibleNeutrons =
        Math.min(5, Math.max(2, Math.ceil(neutrons / 25)));


    for (let i = 0; i < visibleProtons; i++) {

        const proton = document.createElement("div");

        proton.className = "nucleus-particle proton";

        proton.textContent = "p⁺";

        container.appendChild(proton);
    }


    for (let i = 0; i < visibleNeutrons; i++) {

        const neutron = document.createElement("div");

        neutron.className =
            "nucleus-particle neutron";

        neutron.innerHTML = `
            <span class="plus">+</span>
            <span class="minus">−</span>
        `;

        container.appendChild(neutron);
    }

}


/* ==========================================
   إنشاء الإلكترونات
========================================== */

function createElectrons(count, period) {

    const atom =
        document.getElementById("atomVisual");


    atom
        .querySelectorAll(".electron")
        .forEach(e => e.remove());


    /*
      توزيع مبسط بصرياً على مستويات الطاقة.
      الهدف هنا شكل الذرة، وليس صفحة التوزيع الإلكتروني.
    */

    let shells;

    if (count <= 2) {
        shells = [count];
    }

    else if (count <= 10) {
        shells = [2, count - 2];
    }

    else if (count <= 18) {
        shells = [2, 8, count - 10];
    }

    else if (count <= 36) {
        shells = [2, 8, 18, count - 28];
    }

    else if (count <= 54) {
        shells = [2, 8, 18, 18, count - 46];
    }

    else if (count <= 86) {
        shells = [2, 8, 18, 32, count - 60];
    }

    else {
        shells = [2, 8, 18, 32, 18, count - 78];
    }


    shells.forEach((shellCount, shellIndex) => {

        if (shellCount <= 0) return;

        const orbitNumber = shellIndex + 1;

        const orbit =
            atom.querySelector(`.orbit-${orbitNumber}`);

        if (!orbit) return;


        const rect = orbit.getBoundingClientRect();

        const radius =
            Math.min(rect.width, rect.height) / 2;


        for (let i = 0; i < shellCount; i++) {

            const angle =
                (360 / shellCount) * i - 90;

            const radians =
                angle * Math.PI / 180;


            const x =
                Math.cos(radians) * radius;

            const y =
                Math.sin(radians) * radius;


            const electron =
                document.createElement("div");

            electron.className = "electron";

            electron.textContent = "e⁻";


            /*
              نضع الإلكترون على محيط المدار.
            */

            electron.style.left =
                `calc(50% + ${x}px - 14px)`;

            electron.style.top =
                `calc(50% + ${y}px - 14px)`;


            atom.appendChild(electron);

        }

    });

}
